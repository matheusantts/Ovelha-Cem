<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fale Comigo — Ovelha Cem</title>
  <meta name="description" content="Envie uma mensagem, uma oração ou um pedido. Fale com o Ovelha Cem.">
  <meta name="theme-color" content="#8B0000">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ovelha Cem">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Fale Comigo — Ovelha Cem">
  <meta property="og:description" content="Envie uma mensagem, uma oração ou um pedido. Fale com o Ovelha Cem.">
  <meta property="og:url" content="https://ovelhacem.com.br/pages/fale-comigo/">
  <meta property="og:image" content="https://ovelhacem.com.br/assets/images/geral/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://ovelhacem.com.br/pages/fale-comigo/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../src/css/variables.css">
  <link rel="stylesheet" href="fale-comigo.css">
  <link rel="icon" href="../../assets/images/geral/ovelha-cem-icon.png">
</head>
<body>

  <a href="../../index.html" class="home-btn" aria-label="Voltar para a página inicial" title="Voltar para a página inicial">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5"></path>
      <path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"></path>
    </svg>
  </a>

  <div class="ovelha-decorativa" aria-hidden="true">
    <img src="../../assets/images/geral/ovelha-cem-icon.png" alt="">
  </div>

  <main class="cartao">
    <header class="cabecalho">
      <span class="eyebrow">Ovelha Cem</span>
      <h1>Fale Comigo</h1>
      <p class="subtitulo">Vamos caminhar juntos. Deixe sua mensagem, uma oração ou um pedido — responderei com carinho.</p>
    </header>

    <a class="botao-instagram" href="https://instagram.com/matheusesant/" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" rx="5"></rect>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
      </svg>
      Meu instagram
    </a>

    <div class="divisor"><span>ou envie uma mensagem</span></div>

    <form id="formContato" novalidate>
      <div class="campo">
        <label for="nome">Seu nome</label>
        <input type="text" id="nome" name="nome" placeholder="Maria de Nazaré" required>
        <span class="erro" data-erro-para="nome"></span>
      </div>

      <div class="campo">
        <label for="email">Seu email</label>
        <input type="email" id="email" name="email" placeholder="maria@email.com" required>
        <span class="erro" data-erro-para="email"></span>
      </div>

      <div class="campo">
        <label for="mensagem">Sua mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva aqui o que está em seu coração..." required></textarea>
        <span class="erro" data-erro-para="mensagem"></span>
      </div>

      <button type="submit" class="botao-enviar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2 11 13"></path>
          <path d="M22 2 15 22l-4-9-9-4 20-7z"></path>
        </svg>
        Enviar por email
      </button>

      <p class="mensagem-status" id="statusEnvio" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="../../src/js/pages/fale-comigo.js"></script>
</body>
</html>
